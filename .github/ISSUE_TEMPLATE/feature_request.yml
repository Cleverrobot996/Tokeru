name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便，或缺少什么能力。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充
      description: 截图、示例材料、参考链接。
    validations:
      required: false
