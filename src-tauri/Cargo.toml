[package]
name = "tokeru"
version = "0.1.2"
description = "Tokeru - 纸面优先的本地练习应用"
authors = ["Cleverrobot996"]
license = "AGPL-3.0-only"
repository = "https://github.com/Cleverrobot996/Tokeru"
homepage = "https://github.com/Cleverrobot996/Tokeru"
keywords = ["tauri", "education", "exam", "sqlite"]
categories = ["education"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["clock"] }
rmcp = { version = "3.7", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
schemars = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
