<!doctype html>
<html><head><meta charset="utf-8"><style>
  @page { size: A4; margin: 24mm; }
  body { font-family: Georgia, serif; color: #111; }
  h1 { font-size: 24px; border-bottom: 2px solid #111; padding-bottom: 6px; }
  .box { width: 320px; height: 180px; border: 3px solid #333; margin: 24px 0; position: relative; }
  .box::before, .box::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-top: 2px solid #555; transform: rotate(28deg); transform-origin: 0 0; }
  .box::after { transform: rotate(-28deg); transform-origin: 100% 0; }
  p { font-size: 14px; line-height: 1.8; }
</style></head><body>
  <h1>Geometry Practice</h1>
  <p>1. The diagram below shows a rectangle with its diagonals. Find the length of AC.</p>
  <div class="box"></div>
  <p>A. 6 cm &nbsp; B. 8 cm &nbsp; C. 10 cm &nbsp; D. 12 cm</p>
  <p>2. Write a short paragraph about what you see.</p>
</body></html>
